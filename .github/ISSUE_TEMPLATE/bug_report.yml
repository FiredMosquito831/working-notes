name: Bug report
description: Something in the skill, the templates or the installer is wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Include the harness, its version, and the command you ran.
  - type: input
    id: harness
    attributes:
      label: Harness and version
      placeholder: "Claude Code 2.1.312, Codex 0.xx, OpenCode 1.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command, the output, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Installer state
      description: Paste the output of `working-notes list` and `working-notes doctor`.
      render: text
