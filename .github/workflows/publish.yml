name: publish

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read the package version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: A release tag must match the package version
        if: github.event_name == 'release'
        run: |
          tag='${{ github.event.release.tag_name }}'
          tag="${tag#v}"
          if [ "$tag" != "${{ steps.version.outputs.value }}" ]; then
            echo "::error::Release tag '$tag' does not match package.json '${{ steps.version.outputs.value }}'"
            exit 1
          fi

      - name: Is this version already on npm?
        id: check
        run: |
          if npm view "agent-working-notes@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "agent-working-notes@${{ steps.version.outputs.value }} is already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "agent-working-notes@${{ steps.version.outputs.value }} is new."
          fi

      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: npm test

      - name: Validate the repository
        if: steps.check.outputs.publish == 'true'
        run: npm run validate

      - name: Publish with provenance
        if: steps.check.outputs.publish == 'true'
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            echo "Publishing with the NPM_TOKEN secret."
          else
            echo "No NPM_TOKEN set; using npm trusted publishing (OIDC)."
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the published version
        if: steps.check.outputs.publish == 'true'
        run: npm view "agent-working-notes@${{ steps.version.outputs.value }}" version
