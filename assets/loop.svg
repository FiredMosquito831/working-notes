<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="286" viewBox="0 0 1100 286" role="img" aria-labelledby="loopTitle loopDesc">
  <title id="loopTitle">The working-notes loop</title>
  <desc id="loopDesc">Discuss, investigate, spec, decide, build with one implementer, verify. At every PR boundary record the queue, handoff, release history and lessons.</desc>
  <defs>
    <linearGradient id="loopBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1830"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.16"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4a6b"/>
    </marker>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1100" height="286" rx="18" fill="url(#loopBg)" stroke="#1e293b"/>

  <g font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <!-- connectors -->
    <g stroke="#3b4a6b" stroke-width="1.6" marker-end="url(#arrow)">
      <line x1="182" y1="112" x2="204" y2="112"/>
      <line x1="358" y1="112" x2="380" y2="112"/>
      <line x1="534" y1="112" x2="556" y2="112"/>
      <line x1="710" y1="112" x2="732" y2="112"/>
      <line x1="886" y1="112" x2="908" y2="112"/>
    </g>

    <!-- nodes -->
    <g filter="url(#lift)">
      <g transform="translate(32 80)">
        <rect width="150" height="64" rx="12" fill="#0f1b33" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <text x="14" y="24" fill="#5eead4" font-size="10.5" font-weight="700" letter-spacing="1.6">01</text>
        <text x="14" y="46" fill="#e2e8f0" font-size="14.5" font-weight="650">Discuss</text>
      </g>
      <g transform="translate(208 80)">
        <rect width="150" height="64" rx="12" fill="#0f1b33" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <text x="14" y="24" fill="#5eead4" font-size="10.5" font-weight="700" letter-spacing="1.6">02</text>
        <text x="14" y="46" fill="#e2e8f0" font-size="14.5" font-weight="650">Investigate</text>
      </g>
      <g transform="translate(384 80)">
        <rect width="150" height="64" rx="12" fill="#0f1b33" stroke="#60a5fa" stroke-opacity="0.55"/>
        <text x="14" y="24" fill="#93c5fd" font-size="10.5" font-weight="700" letter-spacing="1.6">03</text>
        <text x="14" y="46" fill="#e2e8f0" font-size="14.5" font-weight="650">Spec</text>
      </g>
      <g transform="translate(560 80)">
        <rect width="150" height="64" rx="12" fill="#0f1b33" stroke="#a78bfa" stroke-opacity="0.55"/>
        <text x="14" y="24" fill="#c4b5fd" font-size="10.5" font-weight="700" letter-spacing="1.6">04</text>
        <text x="14" y="46" fill="#e2e8f0" font-size="14.5" font-weight="650">Decide</text>
      </g>
      <g transform="translate(736 80)">
        <rect width="150" height="64" rx="12" fill="#0f1b33" stroke="#fbbf24" stroke-opacity="0.55"/>
        <text x="14" y="24" fill="#fcd34d" font-size="10.5" font-weight="700" letter-spacing="1.6">05</text>
        <text x="14" y="46" fill="#e2e8f0" font-size="14.5" font-weight="650">Build</text>
      </g>
      <g transform="translate(912 80)">
        <rect width="150" height="64" rx="12" fill="#0f1b33" stroke="#34d399" stroke-opacity="0.55"/>
        <text x="14" y="24" fill="#6ee7b7" font-size="10.5" font-weight="700" letter-spacing="1.6">06</text>
        <text x="14" y="46" fill="#e2e8f0" font-size="14.5" font-weight="650">Verify</text>
      </g>
    </g>

    <!-- record band -->
    <g transform="translate(32 180)">
      <rect width="1030" height="64" rx="12" fill="url(#band)" stroke="#334155" stroke-opacity="0.6"/>
      <text x="20" y="27" fill="#cbd5e1" font-size="10.5" font-weight="700" letter-spacing="1.8">AT EVERY PR BOUNDARY</text>
      <text x="20" y="49" fill="#94a3b8" font-size="13.5">Record the queue row, the release-history row, the handoff and the lesson.</text>
      <g transform="translate(856 18)">
        <rect width="154" height="28" rx="14" fill="#020617" fill-opacity="0.55" stroke="#475569" stroke-opacity="0.6"/>
        <text x="77" y="19" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="600">queue · handoff · lessons</text>
      </g>
    </g>

    <text x="32" y="42" fill="#64748b" font-size="11.5" font-weight="600" letter-spacing="2">THE LOOP</text>
    <text x="1068" y="42" text-anchor="end" fill="#64748b" font-size="11.5">nothing is "done" until you verified it</text>
  </g>
</svg>
