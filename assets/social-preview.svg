<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="spTitle spDesc">
  <title id="spTitle">working-notes</title>
  <desc id="spDesc">A portable Agent Skill that gives AI coding agents an operating manual. Works with Claude Code, Codex, OpenCode, Antigravity, Command Code and DeepSeek Harness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.55" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#101a35"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="140" cy="600" rx="400" ry="240" fill="url(#glowTeal)"/>
  <ellipse cx="1140" cy="90" rx="420" ry="260" fill="url(#glowViolet)"/>
  <circle cx="660" cy="80" r="140" fill="#60a5fa" fill-opacity="0.12" filter="url(#soft)"/>

  <g transform="translate(0 130)">
    <g font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
      <rect x="72" y="62" width="252" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="92" y="83" fill="#c4b5fd" font-size="11.5" font-weight="600" letter-spacing="2.1">PORTABLE AGENT SKILL · SKILL.MD</text>

      <text x="68" y="184" fill="url(#titleGrad)" font-size="78" font-weight="750" letter-spacing="-2.5">working-notes</text>
      <rect x="72" y="202" width="118" height="4" rx="2" fill="url(#accent)"/>

      <text x="72" y="238" fill="#cbd5e1" font-size="21" font-weight="500">Investigate first. Write the spec. Decide.</text>
      <text x="72" y="268" fill="#94a3b8" font-size="21" font-weight="400">One implementer. Verify everything. Write it down.</text>

      <g transform="translate(72 312)" font-size="12.5" font-weight="600">
        <g>
          <rect width="110" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
          <circle cx="16" cy="15" r="3.5" fill="#2dd4bf"/>
          <text x="28" y="19.5" fill="#cbd5e1">Claude Code</text>
        </g>
        <g transform="translate(118 0)">
          <rect width="82" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
          <circle cx="16" cy="15" r="3.5" fill="#60a5fa"/>
          <text x="28" y="19.5" fill="#cbd5e1">Codex</text>
        </g>
        <g transform="translate(208 0)">
          <rect width="102" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
          <circle cx="16" cy="15" r="3.5" fill="#a78bfa"/>
          <text x="28" y="19.5" fill="#cbd5e1">OpenCode</text>
        </g>
        <g transform="translate(318 0)">
          <rect width="108" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
          <circle cx="16" cy="15" r="3.5" fill="#f59e0b"/>
          <text x="28" y="19.5" fill="#cbd5e1">Antigravity</text>
        </g>
        <g transform="translate(434 0)">
          <rect width="126" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
          <circle cx="16" cy="15" r="3.5" fill="#f472b6"/>
          <text x="28" y="19.5" fill="#cbd5e1">Command Code</text>
        </g>
        <g transform="translate(568 0)">
          <rect width="142" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
          <circle cx="16" cy="15" r="3.5" fill="#22d3ee"/>
          <text x="28" y="19.5" fill="#cbd5e1">DeepSeek Harness</text>
        </g>
      </g>
    </g>

    <g transform="translate(790 58)" filter="url(#shadow)">
      <rect width="418" height="268" rx="16" fill="#0b1224" stroke="#26324d" stroke-width="1.2"/>
      <rect width="418" height="40" rx="16" fill="#111a30"/>
      <rect y="24" width="418" height="16" fill="#111a30"/>
      <circle cx="22" cy="20" r="5" fill="#f87171" fill-opacity="0.85"/>
      <circle cx="40" cy="20" r="5" fill="#fbbf24" fill-opacity="0.85"/>
      <circle cx="58" cy="20" r="5" fill="#34d399" fill-opacity="0.85"/>
      <text x="209" y="24" text-anchor="middle" font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7c8aa5">your-repo</text>

      <g font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5">
        <g transform="translate(24 68)">
          <rect width="4" height="18" rx="2" fill="#a78bfa"/>
          <text x="16" y="14" fill="#e2e8f0">CLAUDE.md</text>
          <text x="300" y="14" fill="#64748b" font-size="11.5" font-family="Inter, 'Segoe UI', sans-serif">managed block</text>
        </g>
        <g transform="translate(24 105)">
          <rect width="4" height="18" rx="2" fill="#2dd4bf"/>
          <text x="16" y="14" fill="#e2e8f0">WORKING-NOTES.md</text>
          <text x="300" y="14" fill="#64748b" font-size="11.5" font-family="Inter, 'Segoe UI', sans-serif">the manual</text>
        </g>
        <g transform="translate(24 142)">
          <rect width="4" height="18" rx="2" fill="#fbbf24"/>
          <text x="16" y="14" fill="#e2e8f0">QUEUE.md</text>
          <text x="300" y="14" fill="#64748b" font-size="11.5" font-family="Inter, 'Segoe UI', sans-serif">binding order</text>
        </g>
        <g transform="translate(24 179)">
          <rect width="4" height="18" rx="2" fill="#60a5fa"/>
          <text x="16" y="14" fill="#e2e8f0">HANDOFF-2026-10-27.md</text>
          <text x="300" y="14" fill="#64748b" font-size="11.5" font-family="Inter, 'Segoe UI', sans-serif">resume here</text>
        </g>
        <g transform="translate(24 216)">
          <rect width="4" height="18" rx="2" fill="#34d399"/>
          <text x="16" y="14" fill="#e2e8f0">specs/</text>
          <text x="300" y="14" fill="#64748b" font-size="11.5" font-family="Inter, 'Segoe UI', sans-serif">decisions</text>
        </g>
      </g>
    </g>
  </g>

  <g font-family="Inter, 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <line x1="72" y1="540" x2="1208" y2="540" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="72" y="580" fill="#94a3b8" font-size="16">github.com/FiredMosquito831/working-notes</text>
    <text x="1208" y="580" text-anchor="end" fill="#64748b" font-size="16">MIT · SKILL.md · templates/</text>
  </g>
</svg>
